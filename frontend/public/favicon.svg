<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="nucleusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0dcaf0" />
      <stop offset="100%" stop-color="#0d6efd" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6f42c1" />
      <stop offset="100%" stop-color="#d63384" />
    </linearGradient>
  </defs>
  <!-- Orbiting ellipses -->
  <ellipse cx="50" cy="50" rx="42" ry="14" stroke="url(#orbitGrad)" stroke-width="4" transform="rotate(0, 50, 50)" opacity="0.85" />
  <ellipse cx="50" cy="50" rx="42" ry="14" stroke="url(#orbitGrad)" stroke-width="4" transform="rotate(60, 50, 50)" opacity="0.85" />
  <ellipse cx="50" cy="50" rx="42" ry="14" stroke="url(#orbitGrad)" stroke-width="4" transform="rotate(120, 50, 50)" opacity="0.85" />
  <!-- Central Nucleus -->
  <circle cx="50" cy="50" r="11" fill="url(#nucleusGrad)" />
  <!-- Small electrons on orbits -->
  <circle cx="92" cy="50" r="5" fill="#0dcaf0" />
  <circle cx="71" cy="86" r="5" fill="#d63384" />
  <circle cx="29" cy="86" r="5" fill="#0dcaf0" />
</svg>